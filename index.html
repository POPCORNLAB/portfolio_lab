<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <div class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <h2 class="label">ABOUT ME</h2>
        <div class="photo" id="photo"></div>
        <h1 class="name" id="name"></h1>
        <p class="job-title" id="job-title"></p>
        <p class="badge" id="career-badge"></p>

        <ul class="contacts">
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
            </span>
            <div><small>NAME</small><span id="contact-name"></span></div>
          </li>
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <div><small>EMAIL</small><span id="contact-email"></span></div>
          </li>
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
            </span>
            <div><small>PHONE</small><span id="contact-phone"></span></div>
          </li>
          <li>
            <span class="icon-circle">
              <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </span>
            <div><small>LOCATION</small><span id="contact-location"></span></div>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <section class="content">
        <h2 class="section-title">PORTFOLIO</h2>
        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="info-row">
          <div class="info">
            <h3>
              <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>
              EDUCATION
            </h3>
            <p id="education"></p>
          </div>
          <div class="info">
            <h3>
              <svg viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6"/><path d="M16 6l6 6-6 6"/></svg>
              SKILLS &amp; TOOLS
            </h3>
            <p id="skills"></p>
          </div>
          <div class="info">
            <h3>
              <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/></svg>
              EXPERIENCE
            </h3>
            <p id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="status">불러오는 중…</p>
          </div>
        </div>

        <blockquote class="quote" id="quote"></blockquote>
      </section>
    </div>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="section-title">GUESTBOOK</h2>
      <div class="gb-form">
        <input type="text" id="gb-nickname" placeholder="별명 (20자까지)" maxlength="20">
        <input type="text" id="gb-message" placeholder="한마디 남기기 (200자까지)" maxlength="200">
        <button type="button" id="gb-submit">남기기</button>
      </div>
      <p class="gb-notice" id="gb-notice"></p>
      <ul class="gb-list" id="gb-list">
        <li class="status">불러오는 중…</li>
      </ul>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
